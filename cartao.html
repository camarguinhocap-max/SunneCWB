<style>
  :root{
    --stage:#0A0A0B; --stage-2:#111013; --text:#F6F2EA; --muted:#9A948B;
    --brand:#23A455; --brand-ink:#04120A; --brand-soft:rgba(35,164,85,0.22); --gold:#F5B23E;
    --font-display:"Fraunces",Georgia,serif; --font-ui:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(0.22,1,0.36,1);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--stage); color:var(--text); font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased; min-height:100svh;
    display:grid; place-items:center; padding:28px 20px calc(28px + var(--sab));
    overflow-x:hidden;
  }
  ::selection{background:var(--brand); color:var(--brand-ink)}

  /* brilho de fundo que segue o mouse */
  #spot{position:fixed;inset:0;pointer-events:none;z-index:0;mix-blend-mode:screen;
    background:radial-gradient(circle 420px at var(--mx,50%) var(--my,40%),rgba(35,164,85,0.20) 0%,rgba(35,164,85,0.06) 40%,transparent 70%),
               radial-gradient(circle 620px at var(--mx,50%) var(--my,40%),rgba(245,178,62,0.07) 0%,transparent 60%)}

  .card{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:linear-gradient(180deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.10); border-radius:26px;
    padding:34px 26px 26px; text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .card__logo{height:26px;width:auto;display:block;margin:0 auto 22px;opacity:.95}

  .avatar{
    width:112px;height:112px;border-radius:50%;margin:0 auto;
    display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(140deg,var(--brand),#18703a);
    border:2px solid rgba(255,255,255,0.14);
    box-shadow:0 0 0 6px rgba(35,164,85,0.10), 0 14px 34px rgba(0,0,0,.5);
    font-family:var(--font-display); font-size:2.3rem; color:#fff; letter-spacing:.02em;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;transform-origin:center}

  .name{margin-top:18px;font-family:var(--font-display);font-weight:400;font-size:1.85rem;line-height:1.15;letter-spacing:-.01em}
  .role{margin-top:7px;color:var(--brand);font-weight:600;font-size:.82rem;letter-spacing:.18em;text-transform:uppercase}
  .place{margin-top:6px;color:var(--muted);font-size:.95rem}
  .bio{margin-top:16px;color:var(--muted);font-size:.97rem;line-height:1.6}

  .actions{margin-top:26px;display:grid;gap:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:52px;padding:0 20px;border-radius:14px;text-decoration:none;
    font-weight:600;font-size:1rem;border:1px solid transparent;cursor:pointer;
    font-family:var(--font-ui);
    transition:transform .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn svg{width:19px;height:19px;flex:none}
  .btn--wa{background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 28px var(--brand-soft)}
  .btn--line{background:rgba(255,255,255,0.04);color:var(--text);border-color:rgba(255,255,255,0.14)}
  .btn--line:hover{border-color:var(--brand);color:var(--brand)}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .links{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.09);display:grid;gap:9px}
  .link{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border-radius:12px;text-decoration:none;
    background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
    transition:border-color .18s var(--ease),background .18s var(--ease);
  }
  .link:hover{border-color:var(--brand);background:rgba(35,164,85,0.06)}
  .link b{display:block;font-size:.98rem;font-weight:600}
  .link span{display:block;margin-top:2px;color:var(--muted);font-size:.85rem}
  .link .arrow{color:var(--brand);font-size:1.1rem;flex:none}

  .foot{margin-top:20px;color:rgba(154,148,139,.75);font-size:.78rem;line-height:1.5}
  .foot a{color:var(--muted)}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#fff;color:#111;padding:11px 18px;border-radius:999px;
    font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:9
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:380px){ .split{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){ .btn:hover{transform:none} }

<script>
/* ==========================================================================
   DADOS — edite aqui
   ========================================================================== */
const DADOS = {
  nome:      "Josmair Franco de Camargo Filho",
  apelido:   "Josmair",              // usado no vCard e na saudacao
  cargo:     "Assessor de Energia Sunne",
  local:     "Paraná · Região Sul",
  bio:       "Analiso sua conta de luz e mostro quanto dá pra economizar com energia limpa — sem obras, sem investimento e sem compromisso.",
  whatsapp:  "5541998308282",             // 55 + DDD + numero (so digitos)
  telefone:  "5541998308282",             // usado no botao "Ligar"
  email:     "",                          // opcional — deixe "" para ocultar
  site:      "",                          // opcional — ex.: "https://seusite.vercel.app"
  empresa:   "Sunne — Assessoria de Energia",
  msgWpp:    "Olá! Vi seu cartão e quero saber mais sobre a Sunne.",
  foto:      "foto.jpg",                 // salve sua foto com este nome (opcional)
  fotoFoco:  "50% 30%",                 // enquadramento X Y — menor Y sobe (bom p/ rosto)
  fotoZoom:  0.9,                          // 1 = normal | 1.15 aproxima | 0.9 afasta
};

/* ==========================================================================
   MONTAGEM (nao precisa mexer)
   ========================================================================== */
(function () {
  const $ = (id) => document.getElementById(id);
  const soDigitos = (v) => String(v).replace(/\D/g, "");

  // textos
  $('f-nome').textContent  = DADOS.nome;
  $('f-cargo').textContent = DADOS.cargo;
  $('f-local').textContent = DADOS.local;
  $('f-bio').textContent   = DADOS.bio;
  document.title = DADOS.nome + " — " + DADOS.cargo;

  // avatar: foto se existir, senao iniciais
  const av = $('avatar');
  const iniciais = DADOS.nome.trim().split(/\s+/).filter(p => p.length > 2)
    .slice(0, 2).map(p => p[0].toUpperCase()).join('');
  av.textContent = iniciais;
  if (DADOS.foto) {
    // tenta a extensao informada e, se falhar, as outras comuns
    const base = DADOS.foto.replace(/\.(jpg|jpeg|png|webp)$/i, '');
    const exts = ['jpg', 'jpeg', 'png', 'webp'];
    const dada = (DADOS.foto.match(/\.(jpg|jpeg|png|webp)$/i) || [,''])[1].toLowerCase();
    const tentativas = [DADOS.foto].concat(exts.filter(e => e !== dada).map(e => base + '.' + e));
    let i = 0;
    const img = new Image();
    img.alt = DADOS.nome;
    img.onload = () => {
      img.style.objectPosition = DADOS.fotoFoco || '50% 50%';
      img.style.transform = 'scale(' + (DADOS.fotoZoom || 1) + ')';
      av.textContent = ''; av.appendChild(img);
    };
    img.onerror = () => { if (++i < tentativas.length) img.src = tentativas[i]; };
    img.src = tentativas[0];  // se nenhuma existir, ficam as iniciais
  }

  // WhatsApp e telefone
  $('a-wa').href = "https://wa.me/" + soDigitos(DADOS.whatsapp) + "?text=" + encodeURIComponent(DADOS.msgWpp);
  $('a-wa').target = "_blank"; $('a-wa').rel = "noopener";
  $('a-tel').href = "tel:+" + soDigitos(DADOS.telefone);

  // rodape
  $('f-foot').innerHTML = DADOS.empresa + "<br>Atendemos Paraná, Santa Catarina, São Paulo e Mato Grosso do Sul";

  // toast
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // SALVAR CONTATO (.vcf) — gerado no proprio navegador
  $('a-vcard').addEventListener('click', () => {
    const tel = "+" + soDigitos(DADOS.telefone);
    const linhas = [
      "BEGIN:VCARD", "VERSION:3.0",
      "N:" + DADOS.nome, "FN:" + DADOS.nome,
      DADOS.apelido ? "NICKNAME:" + DADOS.apelido : "",
      "ORG:" + DADOS.empresa, "TITLE:" + DADOS.cargo,
      "TEL;TYPE=CELL,VOICE:" + tel,
      DADOS.email ? "EMAIL;TYPE=WORK:" + DADOS.email : "",
      DADOS.site ? "URL:" + DADOS.site : "",
      "ADR;TYPE=WORK:;;;Curitiba;PR;;Brasil",
      "NOTE:" + DADOS.bio,
      "END:VCARD"
    ].filter(Boolean).join("\r\n");

    const blob = new Blob([linhas], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (DADOS.apelido || DADOS.nome).replace(/\s+/g, '-').toLowerCase() + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("Contato baixado");
  });

  // COMPARTILHAR — usa o menu nativo no celular; copia o link no desktop
  $('a-share').addEventListener('click', async () => {
    const url = location.href;
    const dados = { title: DADOS.nome, text: DADOS.cargo + " · " + DADOS.local, url };
    if (navigator.share) {
      try { await navigator.share(dados); return; } catch (e) { /* cancelou */ }
    }
    try { await navigator.clipboard.writeText(url); toast("Link copiado"); }
    catch (e) { toast(url); }
  });

  // brilho seguindo o mouse
  const spot = document.getElementById('spot');
  let mx = innerWidth / 2, my = innerHeight * 0.4, tx = mx, ty = my;
  const fino = matchMedia('(hover: hover)').matches;
  if (fino) window.addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, { passive: true });
  let t = 0;
  (function loop() {
    if (!fino) { t += 0.006; tx = innerWidth * (0.5 + 0.28 * Math.sin(t)); ty = innerHeight * (0.42 + 0.22 * Math.cos(t * 0.8)); }
    mx += (tx - mx) * 0.10; my += (ty - my) * 0.10;
    spot.style.setProperty('--mx', mx + 'px');
    spot.style.setProperty('--my', my + 'px');
    requestAnimationFrame(loop);
  })();
})();
</script>
