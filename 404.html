<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página não encontrada — Sunne Sul</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="Sunne-nova-logo-19.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--stage:#0A0A0B;--text:#F6F2EA;--muted:#9A948B;--brand:#23A455;--brand-ink:#04120A;
    --brand-soft:rgba(35,164,85,.22);--gold:#F5B23E;
    --font-display:"Fraunces",Georgia,serif;--font-ui:"Hanken Grotesk",system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--stage);color:var(--text);font-family:var(--font-ui);min-height:100svh;
    display:grid;place-items:center;padding:40px 24px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  #spot{position:fixed;inset:0;pointer-events:none;z-index:0;mix-blend-mode:screen;
    background:radial-gradient(circle 420px at var(--mx,50%) var(--my,45%),rgba(35,164,85,.18) 0%,transparent 70%),
               radial-gradient(circle 600px at var(--mx,50%) var(--my,45%),rgba(245,178,62,.06) 0%,transparent 60%)}
  .wrap{position:relative;z-index:1;max-width:560px;text-align:center}
  .logo{height:28px;width:auto;margin:0 auto 34px;display:block;opacity:.95}
  .code{font-family:var(--font-display);font-weight:300;font-size:clamp(4.5rem,18vw,9rem);line-height:1;
    letter-spacing:-.02em;background:linear-gradient(180deg,var(--text),rgba(246,242,234,.25));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .plug{margin:6px auto 0;width:64px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);
    box-shadow:0 0 18px var(--brand-soft)}
  h1{margin-top:26px;font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:1.15}
  p{margin-top:16px;color:var(--muted);font-size:clamp(1rem,1.7vw,1.1rem);line-height:1.6}
  .btns{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 26px;border-radius:999px;
    text-decoration:none;font-weight:600;font-size:1rem;transition:transform .18s var(--ease);border:1px solid transparent}
  .btn:hover{transform:translateY(-2px)}
  .btn--p{background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 28px var(--brand-soft)}
  .btn--g{background:transparent;color:var(--text);border-color:rgba(255,255,255,.22)}
  .btn--g:hover{border-color:var(--brand);color:var(--brand)}
  .links{margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);
    display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center}
  .links a{color:var(--muted);text-decoration:none;font-size:.92rem}
  .links a:hover{color:var(--text)}
  @media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
</style>
</head>
<body>
  <div id="spot"></div>

  <main class="wrap">
    <img class="logo" src="Sunne-nova-logo-19.webp" alt="Sunne Sul">

    <div class="code">404</div>
    <div class="plug"></div>

    <h1>Essa página saiu da rede</h1>
    <p>
      O endereço que você tentou acessar não existe ou mudou de lugar.
      Mas a economia na conta de luz continua no mesmo lugar — é só seguir por aqui.
    </p>

    <div class="btns">
      <a class="btn btn--p" href="/">Voltar ao início</a>
      <a class="btn btn--g" href="/energia-por-assinatura.html">Quero economizar</a>
    </div>

    <nav class="links">
      <a href="/energia-por-assinatura.html">Energia por assinatura</a>
      <a href="/assessor.html">Ser assessor</a>
      <a href="/blog.html">Artigos</a>
      <a href="/cartao.html">Contato</a>
    </nav>
  </main>

<script>
  (function(){
    const spot=document.getElementById('spot');
    let mx=innerWidth/2,my=innerHeight*.45,tx=mx,ty=my;
    const fino=matchMedia('(hover: hover)').matches;
    if(fino) addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY},{passive:true});
    let t=0;
    (function loop(){
      if(!fino){t+=.006;tx=innerWidth*(.5+.25*Math.sin(t));ty=innerHeight*(.45+.2*Math.cos(t*.8))}
      mx+=(tx-mx)*.1; my+=(ty-my)*.1;
      spot.style.setProperty('--mx',mx+'px'); spot.style.setProperty('--my',my+'px');
      requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
</html>
